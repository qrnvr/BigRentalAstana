<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

          content="Вход в аккаунт Big Rental Astana">

    <meta name="author" content="Arnur Sadyrov SE-2532">

    <title>Sign In | Big Rental Astana</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/arnur.css">
</head>

<body>

    <!-- Author: Arnur Sadyrov SE-2532 -->

    <header class="page-header">
        <h1>Sign In</h1>
    </header>

    <nav class="site-nav">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="equipment.html">Equipment</a></li>
            <li><a href="cameras.html">Cameras</a></li>
            <li><a href="lenses.html">Lenses</a></li>
            <li><a href="rental.html">Rental</a></li>
            <li><a href="cart.html">Корзина</a></li>
            <li><a href="login.html">Sign In</a></li>
            <li><a href="signup.html">Sign Up</a></li>
            <li><a href="colophon.html">Colophon</a></li>
        </ul>
    </nav>

    <main class="page-main">

        <section class="auth-section" id="login-form">

            <!-- This id is unique because there is only one login section on this page. -->

            <h2>Вход в аккаунт</h2>

            <form method="post"
                  action="#"
                  class="auth-form">

                <!-- No real login happens yet because there is no backend/server. -->

                <fieldset class="auth-fieldset">

                    <legend>
                        Данные для входа
                    </legend>

                    <p>
                        <label for="login-email">
                            Email:
                        </label><br>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="name@example.com"
                            required
                        >
                    </p>

                    <p>
                        <label for="login-password">
                            Пароль:
                        </label><br>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Введите пароль"
                            required
                        >
                    </p>

                    <p>
                        <label>
                            <input
                                type="checkbox"
                                name="remember"
                            >
                            Запомнить меня
                        </label>
                    </p>

                    <p class="action-row">

                        <button type="submit">
                            Sign In
                        </button>

                        <button type="reset">
                            Очистить
                        </button>

                    </p>

                </fieldset>

            </form>

            <p>
                Нет аккаунта?
                <a href="signup.html">
                    Создать аккаунт
                </a>
            </p>

        </section>

    </main>

    <a class="fixed-rental-link" href="rental.html">
        Rental
    </a>

    <footer class="site-footer">

        <p>
            Big Rental Astana &copy; 2026
        </p>

    </footer>

</body>

</html>
